{% extends "base.html" %}
{% block title %}学生列表{% endblock %}
{% block content %}
<section class="card">
  <h2>学生列表</h2>
  <form method="get" action="{{ url_for('students') }}">
    <input type="text" name="kw" value="{{ kw }}" placeholder="按学号或姓名搜索">
    <button type="submit">搜索</button>
    <a class="btn" href="{{ url_for('student_new') }}">新增学生</a>
  </form>
  <table>
    <thead>
      <tr><th>学号</th><th>姓名</th><th>院系</th><th>已修学分</th><th>操作</th></tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.dept_name }}</td>
        <td>{{ s.tot_cred }}</td>
        <td><a href="{{ url_for('student_detail', stu_id=s.id) }}">详情</a></td>
      </tr>
      {% else %}
      <tr><td colspan="5">没有数据</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <p>共 {{ students|length }} 条记录。</p>
</section>
{% endblock %}
